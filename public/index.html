<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Psychokinese Selbstexperiment – Edit‑Marker</title>
  <link rel="stylesheet" href="/app.css" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <link rel="alternate icon" sizes="96x96" href="/favicon-96x96.png" />
</head>
<body>
  <div id="nav"></div>
  <div id="app-root"></div>
  <div id="consent-modal"></div>
  <div id="toast-root"></div>
  <script src="/uid.js" defer></script>
  <script type="module">
    import { mountPsychokinesis } from '/experiments/psychokinesis.js';

    const mount = () => {
      try {
        mountPsychokinesis();
      } catch (error) {
        console.error('Failed to mount psychokinesis experiment', error);
      }
    };

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', mount, { once: true });
    } else {
      mount();
    }
  </script>
</body>
</html>
